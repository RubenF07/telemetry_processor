# Active Telegraf configuration sections only

[[inputs.socket_listener]]
  service_address = "tcp://127.0.0.1:7654"
  data_format = "influx"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "200ms"
  flush_jitter = "0s"
  precision = "0s"

[[outputs.influxdb_v3]]
  urls = ["http://localhost:8181"]
  token = "" # Insert your InfluxDB token here
  database = "influx_test"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
